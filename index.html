<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멀티 브러시 그림 앱</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#202124;color:#f5f5f5;height:100vh;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh}
  header{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#292a2d;border-bottom:1px solid #3d3f43}
  .logo{font-weight:800;font-size:17px;margin-right:8px;white-space:nowrap}
  button,select,input{font:inherit}
  button{border:0;border-radius:8px;padding:8px 11px;background:#3a3c40;color:#fff;cursor:pointer}
  button:hover{background:#4a4c50}
  button.primary{background:#5b67e8}
  button.danger{background:#b43d45}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .toolbar label{font-size:12px;color:#c9c9c9}
  .toolbar input[type="range"]{width:110px;vertical-align:middle}
  .color{width:34px;height:34px;padding:3px;background:#3a3c40}
  .color input{width:100%;height:100%;padding:0;border:0;background:none}
  .workspace{display:flex;flex:1;min-height:0}
  aside{width:220px;background:#252629;border-right:1px solid #3d3f43;padding:12px;overflow:auto}
  aside.right{width:230px;border-right:0;border-left:1px solid #3d3f43}
  .section-title{font-size:12px;color:#aeb0b5;font-weight:700;margin:5px 0 8px;text-transform:uppercase}
  .brushes{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .brush{padding:10px 7px;text-align:center;min-height:58px}
  .brush.active{outline:2px solid #7480ff;background:#454a68}
  .brush-icon{display:block;font-size:20px;margin-bottom:2px}
  .canvas-wrap{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:#17181a;position:relative;overflow:hidden}
  #canvas{background:#fff;box-shadow:0 8px 30px #0008;touch-action:none;cursor:crosshair}
  .canvas-info{position:absolute;bottom:10px;left:10px;background:#0009;border-radius:7px;padding:5px 8px;font-size:11px;color:#ddd}
  .projects{display:flex;flex-direction:column;gap:7px}
  .project{display:flex;align-items:center;gap:7px;padding:8px;background:#303136;border-radius:8px;cursor:pointer}
  .project:hover{background:#3b3c41}
  .project.active{outline:2px solid #6672ed}
  .thumb{width:42px;height:34px;object-fit:cover;background:#fff;border-radius:4px}
  .project-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  .project-x{padding:3px 6px;background:transparent;color:#aaa}
  .empty{font-size:12px;color:#85878d;line-height:1.5}
  .mini-row{display:flex;gap:6px;align-items:center;margin:7px 0}
  .mini-row button{flex:1}
  .value{font-size:12px;color:#ddd;min-width:34px;text-align:right}
  .hint{font-size:11px;color:#8f9197;line-height:1.5;margin-top:10px}
  @media(max-width:900px){
    aside{width:180px}.right{width:190px}
    .logo{display:none}
  }
  @media(max-width:700px){
    aside{display:none}.workspace{position:relative}
    aside.right{display:block;position:absolute;right:0;top:0;bottom:0;z-index:5;width:190px}
  }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">🎨 멀티 브러시</div>
  <div class="toolbar">
    <button class="primary" id="newBtn">새 그림</button>
    <button id="undoBtn">↶</button>
    <button id="redoBtn">↷</button>
    <button id="clearBtn">전체 지우기</button>
    <button id="saveBtn">💾 저장</button>
    <button id="exportBtn">PNG</button>
    <label>색 <span class="color"><input id="color" type="color" value="#222222"></span></label>
    <label>크기 <input id="size" type="range" min="1" max="80" value="12"></label>
    <span class="value" id="sizeValue">12px</span>
  </div>
</header>

<div class="workspace">
  <aside>
    <div class="section-title">브러시</div>
    <div class="brushes" id="brushes">
      <button class="brush active" data-brush="pencil"><span class="brush-icon">✏️</span>연필</button>
      <button class="brush" data-brush="pen"><span class="brush-icon">🖊️</span>펜</button>
      <button class="brush" data-brush="marker"><span class="brush-icon">🖍️</span>마커</button>
      <button class="brush" data-brush="water"><span class="brush-icon">💧</span>수채</button>
      <button class="brush" data-brush="air"><span class="brush-icon">🌫️</span>에어브러시</button>
      <button class="brush" data-brush="neon"><span class="brush-icon">✨</span>네온</button>
      <button class="brush" data-brush="calligraphy"><span class="brush-icon">🖌️</span>캘리그라피</button>
      <button class="brush" data-brush="eraser"><span class="brush-icon">🧽</span>지우개</button>
    </div>
    <div class="section-title" style="margin-top:18px">도구</div>
    <div class="mini-row">
      <button id="fitBtn">화면에 맞춤</button>
      <button id="whiteBtn">흰 배경</button>
    </div>
    <div class="hint">마우스/터치로 그림을 그릴 수 있습니다. Ctrl+Z / Ctrl+Shift+Z로 실행 취소·다시 실행을 사용할 수 있어요.</div>
  </aside>

  <main class="canvas-wrap" id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div class="canvas-info" id="canvasInfo"></div>
  </main>

  <aside class="right">
    <div class="section-title">내 그림</div>
    <div class="mini-row">
      <button class="primary" id="addBtn">＋ 새 그림</button>
    </div>
    <div class="projects" id="projects"></div>
    <div class="hint">그림은 브라우저의 localStorage에 저장됩니다. 같은 브라우저에서 다시 열면 계속 사용할 수 있어요.</div>
  </aside>
</div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'multi_brush_drawings_v1';
  const canvas = document.getElementById('canvas');
  const wrap = document.getElementById('canvasWrap');
  const ctx = canvas.getContext('2d', {willReadFrequently:false});
  const colorEl = document.getElementById('color');
  const sizeEl = document.getElementById('size');
  const sizeValue = document.getElementById('sizeValue');
  const projectsEl = document.getElementById('projects');
  const canvasInfo = document.getElementById('canvasInfo');

  let projects = [];
  let currentId = null;
  let brush = 'pencil';
  let drawing = false;
  let last = null;
  let history = [];
  let historyIndex = -1;
  let saveTimer = null;

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

  function loadProjects(){
    try { projects = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch(e){ projects=[]; }
    if(!projects.length) createProject('그림 1');
    else openProject(projects[0].id);
    renderProjects();
  }

  function createProject(name){
    const p = {id:uid(), name:name || `그림 ${projects.length+1}`, width:1200, height:800, image:null, updated:Date.now()};
    projects.unshift(p);
    currentId=p.id;
    setupCanvas(p.width,p.height);
    fillWhite();
    history=[]; historyIndex=-1; pushHistory();
    saveAll();
    renderProjects();
  }

  function current(){ return projects.find(p=>p.id===currentId); }

  function setupCanvas(w,h){
    canvas.width=w; canvas.height=h;
    fitCanvas();
    canvasInfo.textContent = `${w} × ${h}`;
  }

  function fitCanvas(){
    const maxW=Math.max(100,wrap.clientWidth-30), maxH=Math.max(100,wrap.clientHeight-30);
    const scale=Math.min(maxW/canvas.width,maxH/canvas.height,1);
    canvas.style.width=(canvas.width*scale)+'px';
    canvas.style.height=(canvas.height*scale)+'px';
  }

  function fillWhite(){
    ctx.save(); ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.restore();
  }

  function openProject(id){
    const p=projects.find(x=>x.id===id); if(!p)return;
    currentId=id; setupCanvas(p.width,p.height);
    if(p.image){
      const img=new Image();
      img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);history=[];historyIndex=-1;pushHistory();};
      img.src=p.image;
    } else { fillWhite(); history=[];historyIndex=-1;pushHistory(); }
    renderProjects();
  }

  function snapshot(){ return canvas.toDataURL('image/png'); }

  function pushHistory(){
    const s=snapshot();
    if(historyIndex<history.length-1) history=history.slice(0,historyIndex+1);
    history.push(s);
    if(history.length>30) history.shift();
    historyIndex=history.length-1;
  }

  function restore(data){
    const img=new Image();
    img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);scheduleSave();};
    img.src=data;
  }

  function undo(){
    if(historyIndex<=0)return;
    historyIndex--; restore(history[historyIndex]);
  }
  function redo(){
    if(historyIndex>=history.length-1)return;
    historyIndex++; restore(history[historyIndex]);
  }

  function saveCurrent(){
    const p=current(); if(!p)return;
    p.image=snapshot(); p.updated=Date.now(); p.width=canvas.width;p.height=canvas.height;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));
    renderProjects();
  }
  function scheduleSave(){
    clearTimeout(saveTimer); saveTimer=setTimeout(saveCurrent,350);
  }
  function saveAll(){ saveCurrent(); }

  function renderProjects(){
    projectsEl.innerHTML='';
    if(!projects.length){projectsEl.innerHTML='<div class="empty">저장된 그림이 없습니다.</div>';return;}
    projects.forEach(p=>{
      const row=document.createElement('div'); row.className='project'+(p.id===currentId?' active':'');
      const img=document.createElement('img'); img.className='thumb';
      img.src=p.image || blankThumb();
      const name=document.createElement('div'); name.className='project-name'; name.textContent=p.name;
      name.title='더블클릭하여 이름 변경';
      name.ondblclick=e=>{e.stopPropagation(); renameProject(p.id);};
      const del=document.createElement('button'); del.className='project-x'; del.textContent='×'; del.title='삭제';
      del.onclick=e=>{e.stopPropagation(); deleteProject(p.id);};
      row.onclick=()=>{saveCurrent();openProject(p.id);};
      row.append(img,name,del); projectsEl.appendChild(row);
    });
  }

  function blankThumb(){
    const c=document.createElement('canvas');c.width=84;c.height=68;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,84,68);return c.toDataURL();
  }

  function renameProject(id){
    const p=projects.find(x=>x.id===id);if(!p)return;
    const n=prompt('그림 이름',p.name);
    if(n && n.trim()){p.name=n.trim();p.updated=Date.now();saveAll();renderProjects();}
  }

  function deleteProject(id){
    const p=projects.find(x=>x.id===id);if(!p)return;
    if(projects.length===1){alert('그림은 최소 1개를 유지합니다.');return;}
    if(!confirm(`"${p.name}"을(를) 삭제할까요?`))return;
    projects=projects.filter(x=>x.id!==id);
    if(currentId===id){currentId=projects[0].id;openProject(currentId);}
    saveAll();renderProjects();
  }

  function pointFromEvent(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
  }

  function applyBrush(p1,p2){
    const s=Number(sizeEl.value), c=colorEl.value;
    ctx.save();
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle=c;ctx.fillStyle=c;
    if(brush==='eraser'){
      ctx.globalCompositeOperation='destination-out';ctx.lineWidth=s*1.5;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    } else if(brush==='pencil'){
      ctx.globalAlpha=.75;ctx.lineWidth=Math.max(1,s*.65);
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    } else if(brush==='pen'){
      ctx.lineWidth=s;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    } else if(brush==='marker'){
      ctx.globalAlpha=.28;ctx.lineWidth=s*2.2;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    } else if(brush==='water'){
      ctx.globalAlpha=.12;ctx.lineWidth=s*3.5;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
      ctx.globalAlpha=.06;ctx.lineWidth=s*6;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    } else if(brush==='air'){
      const radius=s*2.5, dist=Math.hypot(p2.x-p1.x,p2.y-p1.y)||1;
      const steps=Math.ceil(dist/Math.max(2,s/2));
      for(let i=0;i<steps;i++){
        const t=i/steps,x=p1.x+(p2.x-p1.x)*t,y=p1.y+(p2.y-p1.y)*t;
        const g=ctx.createRadialGradient(x,y,0,x,y,radius);
        g.addColorStop(0,c+'55');g.addColorStop(.45,c+'18');g.addColorStop(1,c+'00');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();
      }
    } else if(brush==='neon'){
      ctx.shadowColor=c;ctx.shadowBlur=s*1.8;ctx.globalAlpha=.95;ctx.lineWidth=s;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
      ctx.shadowBlur=0;ctx.globalAlpha=.9;ctx.lineWidth=Math.max(1,s*.25);
      ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    } else if(brush==='calligraphy'){
      ctx.lineWidth=Math.max(1,s*.9);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    }
    ctx.restore();
  }

  function startDraw(e){
    e.preventDefault(); drawing=true; canvas.setPointerCapture(e.pointerId);
    last=pointFromEvent(e);
    applyBrush(last,{x:last.x+.01,y:last.y+.01});
  }
  function moveDraw(e){
    if(!drawing)return;e.preventDefault();
    const p=pointFromEvent(e);applyBrush(last,p);last=p;
  }
  function endDraw(){
    if(!drawing)return;drawing=false;last=null;pushHistory();scheduleSave();
  }

  canvas.addEventListener('pointerdown',startDraw);
  canvas.addEventListener('pointermove',moveDraw);
  canvas.addEventListener('pointerup',endDraw);
  canvas.addEventListener('pointercancel',endDraw);

  document.querySelectorAll('.brush').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.brush').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');brush=b.dataset.brush;
  });
  sizeEl.oninput=()=>sizeValue.textContent=sizeEl.value+'px';
  document.getElementById('undoBtn').onclick=undo;
  document.getElementById('redoBtn').onclick=redo;
  document.getElementById('saveBtn').onclick=saveAll;
  document.getElementById('newBtn').onclick=()=>createProject();
  document.getElementById('addBtn').onclick=()=>createProject();
  document.getElementById('clearBtn').onclick=()=>{
    if(confirm('현재 그림을 모두 지울까요?')){fillWhite();pushHistory();scheduleSave();}
  };
  document.getElementById('whiteBtn').onclick=()=>{fillWhite();pushHistory();scheduleSave();};
  document.getElementById('fitBtn').onclick=fitCanvas;
  document.getElementById('exportBtn').onclick=()=>{
    const a=document.createElement('a');a.download=(current()?.name||'drawing')+'.png';a.href=snapshot();a.click();
  };
  window.addEventListener('resize',fitCanvas);
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}
  });

  loadProjects();
})();
</script>
</body>
</html>
